name: Build AIC8800 SDIO

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  SDK_URL: https://downloads.openwrt.org/releases/24.10.7/targets/rockchip/armv8/openwrt-sdk-24.10.7-rockchip-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
  SDK_DIR: openwrt-sdk-24.10.7-rockchip-armv8_gcc-13.3.0_musl.Linux-x86_64

jobs:
  build:
    name: Build kmod-aic8800-sdio (rockchip/armv8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: aic8800-sdio-openwrt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools python3-dev \
            rsync swig unzip zlib1g-dev file wget zstd libelf-dev

      - name: Download and extract SDK
        run: |
          wget -q "$SDK_URL"
          tar --zstd -xf $(basename "$SDK_URL")

      - name: Download patches from radxa-pkg/aic8800
        run: |
          cd aic8800-sdio-openwrt/aic8800-sdio/patches
          RADXA_RAW="https://raw.githubusercontent.com/radxa-pkg/aic8800/main/debian/patches"
          declare -A MAP=(
            ["fix-sdio-firmware-path.patch"]="010-fix-sdio-firmware-path.patch"
            ["fix-sdio-fall-through.patch"]="020-fix-sdio-fall-through.patch"
            ["fix-debug-file-with-no-debug-symbols.patch"]="030-fix-debug-file-with-no-debug-symbols.patch"
            ["fix-linux-6.1-build.patch"]="040-fix-linux-6.1-build.patch"
            ["fix-linux-6.5-build.patch"]="050-fix-linux-6.5-build.patch"
            ["fix-linux-6.7-build.patch"]="060-fix-linux-6.7-build.patch"
            ["fix-linux-6.9-build.patch"]="070-fix-linux-6.9-build.patch"
            ["fix-vmalloc-not-include.patch"]="080-fix-vmalloc-not-include.patch"
          )
          for src in "${!MAP[@]}"; do
            dst="${MAP[$src]}"
            echo "Downloading $src -> $dst"
            curl -sL "$RADXA_RAW/$src" -o "$dst"
          done

      - name: Setup SDK and build
        run: |
          cd "$SDK_DIR"
          # Update feeds and install
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Add aic8800-sdio package
          cp -r "$GITHUB_WORKSPACE/aic8800-sdio-openwrt/aic8800-sdio" package/kernel/aic8800-sdio
          # Configure - include mac80211 to build it first
          cat > .config <<EOF
          CONFIG_PACKAGE_kmod-mac80211=m
          CONFIG_PACKAGE_kmod-cfg80211=m
          CONFIG_PACKAGE_kmod-aic8800-sdio=m
          CONFIG_PACKAGE_aic8800-sdio-firmware=m
          EOF
          make defconfig
          # Build mac80211/cfg80211 first (via feeds path)
          make package/mac80211/compile V=s -j$(nproc) || make package/feeds/base/mac80211/compile V=s -j$(nproc)
          # Merge mac80211 symvers into kernel Module.symvers
          KERNEL_SYMVERS=$(find build_dir -path "*/linux-6.6.*/Module.symvers" | head -1)
          MAC80211_SYMVERS=$(find build_dir -path "*/symvers/mac80211.symvers" | head -1)
          if [ -n "$KERNEL_SYMVERS" ] && [ -n "$MAC80211_SYMVERS" ]; then
            echo "Merging $MAC80211_SYMVERS into $KERNEL_SYMVERS (deduped)"
            awk 'NR==FNR{seen[$2];next} !($2 in seen)' "$KERNEL_SYMVERS" "$MAC80211_SYMVERS" >> "$KERNEL_SYMVERS"
          else
            echo "ERROR: symvers not found. KERNEL=$KERNEL_SYMVERS MAC80211=$MAC80211_SYMVERS"
            echo "Available symvers:"
            find build_dir -name "*.symvers" -o -name "Module.symvers" 2>/dev/null
            exit 1
          fi
          # Build aic8800
          make package/aic8800-sdio/compile V=s -j$(nproc)

      - name: Collect packages
        run: |
          mkdir -p output
          find "$SDK_DIR/bin/" -name "*aic8800*" -exec cp {} output/ \;
          ls -la output/

      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-sdio-rockchip_armv8
          path: output/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*

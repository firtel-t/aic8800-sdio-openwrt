name: Build AIC8800 SDIO

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  OPENWRT_VERSION: v24.10.7

jobs:
  build:
    name: Build kmod-aic8800-sdio (rockchip/armv8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: aic8800-sdio-openwrt

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get -qq autoremove --purge
          sudo apt-get -qq clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools python3-dev \
            rsync swig unzip zlib1g-dev file wget qemu-utils libelf-dev

      - name: Clone OpenWrt
        run: |
          git clone https://github.com/openwrt/openwrt.git
          cd openwrt
          git checkout ab4c7d6af7

      - name: Download patches from radxa-pkg/aic8800
        run: |
          cd aic8800-sdio-openwrt/aic8800-sdio/patches
          RADXA_RAW="https://raw.githubusercontent.com/radxa-pkg/aic8800/main/debian/patches"
          declare -A MAP=(
            ["fix-sdio-firmware-path.patch"]="010-fix-sdio-firmware-path.patch"
            ["fix-sdio-fall-through.patch"]="020-fix-sdio-fall-through.patch"
            ["fix-debug-file-with-no-debug-symbols.patch"]="030-fix-debug-file-with-no-debug-symbols.patch"
            ["fix-linux-6.1-build.patch"]="040-fix-linux-6.1-build.patch"
            ["fix-linux-6.5-build.patch"]="050-fix-linux-6.5-build.patch"
            ["fix-linux-6.7-build.patch"]="060-fix-linux-6.7-build.patch"
            ["fix-linux-6.9-build.patch"]="070-fix-linux-6.9-build.patch"
            ["fix-vmalloc-not-include.patch"]="080-fix-vmalloc-not-include.patch"
          )
          for src in "${!MAP[@]}"; do
            dst="${MAP[$src]}"
            echo "Downloading $src -> $dst"
            curl -sL "$RADXA_RAW/$src" -o "$dst"
          done

      - name: Add aic8800-sdio feed
        run: |
          cd openwrt
          echo "src-link aic8800 $GITHUB_WORKSPACE/aic8800-sdio-openwrt" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for rockchip/armv8
        run: |
          cd openwrt
          wget -O .config https://downloads.openwrt.org/releases/24.10.7/targets/rockchip/armv8/config.buildinfo
          echo "CONFIG_PACKAGE_kmod-aic8800-sdio=m" >> .config
          echo "CONFIG_PACKAGE_aic8800-sdio-firmware=m" >> .config
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) V=s || make download -j1 V=s

      - name: Build toolchain and kernel
        run: |
          cd openwrt
          make tools/install -j$(nproc) V=s
          make toolchain/install -j$(nproc) V=s
          make target/linux/compile -j$(nproc) V=s

      - name: Build mac80211 (cfg80211 dependency)
        run: |
          cd openwrt
          make package/kernel/mac80211/compile -j$(nproc) V=s

      - name: Prepare aic8800-sdio source (download + patch)
        run: |
          cd openwrt
          make package/aic8800-sdio/download V=s
          make package/aic8800-sdio/prepare V=s || true

      - name: Merge mac80211 symvers and build aic8800-sdio
        run: |
          cd openwrt
          # Merge mac80211 symvers into kernel Module.symvers (deduplicated)
          KERNEL_SYMVERS=$(find build_dir -path "*/linux-6.6.*/Module.symvers" | head -1)
          MAC80211_SYMVERS=$(find build_dir -path "*/symvers/mac80211.symvers" | head -1)
          echo "Kernel symvers: $KERNEL_SYMVERS"
          echo "MAC80211 symvers: $MAC80211_SYMVERS"
          if [ -n "$KERNEL_SYMVERS" ] && [ -n "$MAC80211_SYMVERS" ]; then
            BEFORE=$(wc -l < "$KERNEL_SYMVERS")
            awk 'NR==FNR{seen[$2];next} !($2 in seen)' "$KERNEL_SYMVERS" "$MAC80211_SYMVERS" >> "$KERNEL_SYMVERS"
            AFTER=$(wc -l < "$KERNEL_SYMVERS")
            echo "Merged: $BEFORE -> $AFTER lines"
            echo "cfg80211_get_bss present: $(grep -c cfg80211_get_bss "$KERNEL_SYMVERS")"
          else
            echo "ERROR: symvers files not found!"
            exit 1
          fi
          # Build aic8800-sdio directly using make in the source dir
          SRCDIR=$(find build_dir -type d -name "aic8800-sdio-*" | head -1)
          LINUX_DIR=$(find build_dir -type d -name "linux-6.6.*" -path "*/linux-rockchip_armv8/*" | head -1)
          echo "Source dir: $SRCDIR"
          echo "Linux dir: $LINUX_DIR"
          make -C "$LINUX_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE=$(find staging_dir/toolchain-*/bin -name "aarch64-openwrt-linux-musl-gcc" | head -1 | sed 's/gcc$//') \
            M="$SRCDIR/src/SDIO/driver_fw/driver/aic8800" \
            EXTRA_CFLAGS="-DCONFIG_AIC8800_WLAN_SUPPORT=1 -DAICWF_SDIO_SUPPORT -Wno-error" \
            CONFIG_AIC8800_BTLPM_SUPPORT=n \
            modules

      - name: Collect packages
        run: |
          mkdir -p output
          find openwrt/bin/ -name "*aic8800*" -exec cp {} output/ \;
          ls -la output/

      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: aic8800-sdio-rockchip_armv8
          path: output/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
